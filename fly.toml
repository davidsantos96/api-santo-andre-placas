app = 'api-santo-andre-placas'
primary_region = 'gru'

[build]
[env]
  ADMIN_SEED_EMAIL = 'dono@SEUDOMINIO.com.br'
  ADMIN_SEED_LOGIN = 'admin'
  ALLOWED_ORIGINS = 'https://front-santo-andre-placas.davidpbarros96.workers.dev'
  SPRING_PROFILES_ACTIVE = 'prod'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'
