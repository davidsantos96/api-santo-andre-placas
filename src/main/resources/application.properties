spring.application.name=api-santo-andre-placas
spring.datasource.url=jdbc:h2:mem:santoandreplacas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.seed.admin.email=${ADMIN_SEED_EMAIL:admin@santoandreplacas.com.br}
app.seed.admin.senha=${ADMIN_SEED_PASSWORD:admin123}
app.seed.admin.nome=${ADMIN_SEED_NOME:Administrador}