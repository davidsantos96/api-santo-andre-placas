spring.application.name=api-santo-andre-placas
spring.datasource.url=jdbc:h2:mem:santoandreplacas
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

app.jwt.secret=${JWT_SECRET:}
app.cors.allowed-origins=${ALLOWED_ORIGINS:http://localhost:5173,http://127.0.0.1:5173}

app.seed.admin.login=${ADMIN_SEED_LOGIN:admin}
app.seed.admin.email=${ADMIN_SEED_EMAIL:admin@santoandreplacas.com.br}
app.seed.admin.senha=${ADMIN_SEED_PASSWORD:}
app.seed.admin.nome=${ADMIN_SEED_NOME:Administrador}